# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3.0"

set: ['e', 'u', 'pipefail']
shopt: ['globstar']

dotenv: ['.env']

vars:
  BIN: cga
  SH_SRC: clean_git_artifacts.sh
  ZIG_SRC: clean_git_artifacts.zig
  MOJO_SRC: spike_mojo/cga_mojo.mojo
  ZIG_BIN: bin/zig/{{.BIN}}
  MOJO_BIN: bin/mojo/{{.BIN}}

tasks:
  default:
    desc: "Default task"
    cmds:
      - task --list

  _build:
    internal: true
    desc: "Compile OUT via CMD, creating its parent dir first (shared by build:*)"
    cmds:
      - mkdir -p "$(dirname {{.OUT}})"
      - "{{.CMD}}"

  build:
    desc: "Build all implementations (zig, mojo)"
    cmds:
      - task: build:zig
      - task: build:mojo

  build:zig:
    desc: "Compile the Zig implementation to ./bin/zig/cga"
    cmds:
      - task: _build
        vars:
          OUT: "{{.ZIG_BIN}}"
          CMD: "zig build-exe -O ReleaseFast -target aarch64-macos -lc -femit-bin={{.ZIG_BIN}} {{.ZIG_SRC}}"
    generates:
      - "{{.ZIG_BIN}}"
    sources:
      - "{{.ZIG_SRC}}"

  build:mojo:
    desc: "Compile the Mojo spike to ./bin/mojo/cga"
    cmds:
      - task: _build
        vars:
          OUT: "{{.MOJO_BIN}}"
          CMD: "mojo build {{.MOJO_SRC}} -o {{.MOJO_BIN}}"
    generates:
      - "{{.MOJO_BIN}}"
    sources:
      - "{{.MOJO_SRC}}"

  bench:
    desc: "Benchmark the bash script against the built Zig and Mojo binaries"
    cmds:
      - task: build:zig
      - task: build:mojo
      - hyperfine --warmup 1 -n bash "bash {{.SH_SRC}}" -n zig "./{{.ZIG_BIN}}" -n mojo "./{{.MOJO_BIN}}"

  clean:
    desc: "Remove build artifacts"
    status:
      - test ! -d bin
    cmds:
      - rm -rf bin
